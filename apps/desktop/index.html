<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-OS Launcher</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="orb-wrap">
        <div class="orb" aria-label="AI listening orb"></div>
      </section>
      <section class="panel">
        <h1>AI-OS</h1>
        <p class="subtitle">Local-first AI launcher — Sprint 1 shell</p>
        <div id="status" class="status checking">Checking daemon...</div>
        <input id="prompt" placeholder="Try: Open downloads and summarize latest PDF" />
        <div class="actions">
          <button id="send">Send</button>
          <button id="voice" class="ghost">Voice</button>
        </div>
        <pre id="response">Ready.</pre>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
