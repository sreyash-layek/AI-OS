[package]
name = "ai_os_desktop"
version = "0.1.0"
description = "AI-OS Desktop"
authors = ["Sreyash Layek"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
